<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply: Individual Loans — IDLC Finance</title>
  <meta name="description" content="Choose between Home Loan, Car Loan, and Personal Loan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body class="apply-page">

  <div class="demo-ribbon" role="note">
    <span data-i18n="demo_disclaimer">Educational prototype only — not affiliated with IDLC Finance PLC.</span>
  </div>

  <header class="apply-header">
    <a href="index.html" class="brand" aria-label="IDLC Finance home">
      <span class="brand-mark">I</span>
      <span data-i18n="brand_name">IDLC</span>
    </a>

    <div class="lang-toggle" role="group" aria-label="Language">
      <button data-lang="en" class="lang-btn active" type="button" aria-pressed="true">EN</button>
      <button data-lang="bn" class="lang-btn" type="button" aria-pressed="false">বাং</button>
    </div>
  </header>

  <main class="apply-main">
    <a href="apply.html" class="back-link" data-i18n="back">← Back</a>
    <span class="apply-eyebrow" data-i18n="loan_individual">Loan for Individuals</span>
    <h1 class="apply-title" data-i18n="choose_loan_type">Choose your loan type</h1>
    <p class="apply-subtitle" data-i18n="choose_loan_sub">Pick a product to continue.</p>

    <div class="loan-options">

      <a href="apply-home-loan.html" class="loan-card loan-card--compact" aria-label="Home Loan">
        <div class="loan-card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l9-8 9 8"/>
            <path d="M5 10v10h14V10"/>
            <rect x="10" y="14" width="4" height="6"/>
            <rect x="15" y="13" width="3" height="3"/>
          </svg>
        </div>
        <h2 data-i18n="prod_home_loan">Home Loan</h2>
      </a>

      <a href="apply-car-loan.html" class="loan-card loan-card--compact" aria-label="Car Loan">
        <div class="loan-card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 15h18v3h-2a1.5 1.5 0 0 1-3 0H8a1.5 1.5 0 0 1-3 0H3v-3z"/>
            <path d="M5 15l1.5-5h11L19 15"/>
            <circle cx="7" cy="18" r="1.3"/>
            <circle cx="17" cy="18" r="1.3"/>
          </svg>
        </div>
        <h2 data-i18n="prod_car_loan">Car Loan</h2>
      </a>

      <a href="apply-personal-loan.html" class="loan-card loan-card--compact" aria-label="Personal Loan">
        <div class="loan-card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="1.5"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
            <rect x="4" y="13" width="5" height="3" rx="0.5"/>
            <line x1="13" y1="15" x2="20" y2="15"/>
          </svg>
        </div>
        <h2 data-i18n="prod_personal_loan">Personal Loan</h2>
      </a>

    </div>

    <p class="apply-footer-note" data-i18n-html="footer_note_html">
      Your information is encrypted and reviewed only by authorised officers. <strong>BB-regulated.</strong>
    </p>
  </main>

  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
